spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:agent_oj_workflow}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:agent_oj}
    password: ${MYSQL_PASSWORD:agent_oj123456}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_MODEL:qwen-flash}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
  vector:
    milvus:
      uri: ${VECTOR_MILVUS_URI:http://milvus:19530}
      token: ${VECTOR_MILVUS_TOKEN:root:Milvus}
      collection-name: ${VECTOR_MILVUS_COLLECTION:algorithm_question_vector}
      knowledge-collection-name: ${VECTOR_MILVUS_KNOWLEDGE_COLLECTION:knowledge_segment_vector}
    embedding:
      dimension: ${VECTOR_EMBEDDING_DIMENSION:1024}
  file:
    minio:
      endpoint: ${FILE_MINIO_ENDPOINT:http://minio:9000}
      access-key: ${FILE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${FILE_MINIO_SECRET_KEY:minioadmin}
      bucket: ${FILE_MINIO_BUCKET:agent-oj-files}
      base-url: ${FILE_MINIO_BASE_URL:http://localhost:9000}
      auto-create-bucket: ${FILE_MINIO_AUTO_CREATE_BUCKET:true}
  mineru:
    base-url: ${MINERU_BASE_URL:https://mineru.net}
    api-key: ${MINERU_API_KEY}
    poll-interval-millis: ${MINERU_POLL_INTERVAL_MILLIS:3000}
    max-poll-attempts: ${MINERU_MAX_POLL_ATTEMPTS:120}
    enable-formula: ${MINERU_ENABLE_FORMULA:true}
    language: ${MINERU_LANGUAGE:ch}
